<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理年龄测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#475569',
                        secondary: '#64748b',
                        light: '#f8fafc',
                        accent: '#818cf8',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
            }
            .option-hover {
                @apply transition-all duration-300 hover:border-accent hover:bg-indigo-50;
            }
        }
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen text-primary">
    <div class="max-w-2xl mx-auto px-4 py-10">
        <!-- 首页 -->
        <div id="start-page" class="block">
            <div class="bg-white rounded-2xl p-8 card-shadow">
                <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-semibold text-center mb-4">心理年龄测试</h1>
                <p class="text-secondary text-center mb-8">你的心智，不一定和你的岁数同步。完成30道选择题，看看你的心理年龄。</p>
                
                <div class="mb-6">
                    <label class="block mb-2 font-medium">你的实际年龄：</label>
                    <input type="number" id="realAge" min="10" max="80" placeholder="请输入你的真实年龄" class="w-full border border-slate-200 rounded-lg px-4 py-3 outline-accent">
                </div>
                <button onclick="startTest()" class="w-full bg-primary text-white py-3 rounded-lg text-lg transition hover:bg-secondary">
                    开始测试 <i class="fa fa-arrow-right ml-2"></i>
                </button>
                <p class="text-xs text-slate-400 mt-4 text-center">所有答案仅在本地计算，不会上传任何个人信息</p>
            </div>
        </div>

        <!-- 题目页面 -->
        <div id="question-page" class="hidden">
            <div class="bg-white rounded-2xl p-6 md:p-8 card-shadow">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-sm text-secondary">进度：<span id="currentNum">1</span>/30</span>
                    <div class="w-3/4 bg-slate-100 rounded-full h-2">
                        <div id="progressBar" class="bg-accent h-2 rounded-full" style="width:3.3%"></div>
                    </div>
                </div>
                <h2 id="question-title" class="text-lg md:text-xl font-medium mb-6"></h2>
                <div id="options-box" class="space-y-3"></div>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="result-page" class="hidden">
            <div class="bg-white rounded-2xl p-8 card-shadow">
                <h2 class="text-2xl font-semibold text-center mb-6">测试结果</h2>
                <div class="text-center mb-8">
                    <p class="text-secondary mb-2">你的实际年龄：<span id="res-real" class="text-xl font-medium"></span> 岁</p>
                    <p class="text-secondary mb-2">你的心理年龄：<span id="res-psy" class="text-3xl text-accent font-bold"></span> 岁</p>
                    <p id="diff-text" class="text-lg mt-2"></p>
                </div>
                <div class="border-t border-slate-100 pt-6">
                    <h3 class="font-semibold mb-3">心理分析：</h3>
                    <p id="analysis-text" class="text-secondary leading-relaxed"></p>
                </div>
                <button onclick="restart()" class="w-full mt-8 bg-primary text-white py-3 rounded-lg transition hover:bg-secondary">
                    重新测试
                </button>
            </div>
        </div>
    </div>

<script>
// 30道测试题目
const questions = [
    { q: "周末有空，你更愿意？", o:["A. 和朋友出门聚会","B. 在家安静独处","C. 安排学习提升自己","D. 随机做点新鲜事"] },
    { q: "遇到计划被突然打乱，你第一反应？", o:["A. 烦躁不安，难以适应","B. 有点无奈，慢慢调整","C. 冷静接受，重新规划","D. 觉得有意思，顺势改变"] },
    { q: "评价一件事，你更看重？", o:["A. 感受好不好","B. 是否公平合理","C. 效率与结果","D. 是否有趣新奇"] },
    { q: "别人对你提出批评，你通常？", o:["A. 心里难过很久","B. 先看对方态度","C. 理性判断对错","D. 一笑而过不在意"] },
    { q: "面对新的电子产品，你？", o:["A. 不敢尝试，怕出错","B. 有人教才愿意试","C. 自己看说明摸索","D. 主动研究尝鲜"] },
    { q: "回想过去，你常常？", o:["A. 遗憾怀念往事","B. 偶尔回忆片段","C. 很少回头看过去","D. 觉得过去都无所谓"] },
    { q: "做选择的时候，你倾向？", o:["A. 纠结很久难决定","B. 参考别人意见","C. 快速权衡做决定","D. 凭直觉一拍即定"] },
    { q: "生活压力大的时候，你会？", o:["A. 容易情绪崩溃","B. 和人倾诉减压","C. 埋头解决问题","D. 转移注意力放空"] },
    { q: "关于未来，你？", o:["A. 常常感到焦虑","B. 偶尔担忧未来","C. 有清晰目标规划","D. 不想多想，顺其自然"] },
    { q: "交朋友，你更偏好？", o:["A. 交心少数挚友","B. 关系温和稳定","C. 志同道合伙伴","D. 广泛认识新朋友"] },
    { q: "看到别人过得比你好，你？", o:["A. 容易自卑羡慕","B. 祝福但不攀比","C. 当作前进动力","D. 没什么感觉"] },
    { q: "你怎么看待规则？", o:["A. 严格遵守全部规则","B. 遵守大部分规则","C. 合理的才遵守","D. 不喜欢被规则束缚"] },
    { q: "空闲阅读，你偏爱？", o:["A. 情感故事小说","B. 散文生活随笔","C. 专业干货书籍","D. 猎奇新奇内容"] },
    { q: "团队里出现矛盾，你会？", o:["A. 尽量回避冲突","B. 调和双方关系","C. 就事论事解决","D. 看热闹不参与"] },
    { q: "你对改变生活现状的态度？", o:["A. 害怕改变现状","B. 有把握才改变","C. 主动寻求突破","D. 喜欢频繁变化"] },
    { q: "回忆童年，你的感受？", o:["A. 很怀念童年","B. 有甜也有遗憾","C. 童年只是过往","D. 很少想起童年"] },
    { q: "做一件有挑战的事，你？", o:["A. 担心失败不敢开始","B. 准备充分再动手","C. 边做边调整方案","D. 立刻行动试试看"] },
    { q: "当别人失信于你，你？", o:["A. 很难原谅对方","B. 需要时间释怀","C. 理解但保持距离","D. 很快放下不计较"] },
    { q: "消费购物，你习惯？", o:["A. 冲动随心购买","B. 喜欢就适度买","C. 按需理性消费","D. 喜欢省钱储蓄"] },
    { q: "夜晚睡前，你常常？", o:["A. 胡思乱想失眠","B. 简单复盘一天","C. 放下事情快速入睡","D. 刷手机直到困倦"] },
    { q: "你如何看待挫折？", o:["A. 打击很大很难恢复","B. 难过一段时间复原","C. 挫折是成长经验","D. 挫折只是小事"] },
    { q: "社交场合，你一般？", o:["A. 紧张，希望早点离开","B. 温和礼貌参与交流","C. 从容表达观点","D. 主动活跃气氛"] },
    { q: "你怎么看待新鲜潮流？", o:["A. 不感兴趣，不愿跟风","B. 身边人玩才了解","C. 感兴趣，选择性尝试","D. 主动追逐新潮流"] },
    { q: "如果和人观点不一样，你？", o:["A. 避免争辩，顺从对方","B. 委婉表达想法","C. 直接理性辩论","D. 不想争论直接跳过"] },
    { q: "你认为幸福更多来自？", o:["A. 情感陪伴与爱","B. 安稳平淡生活","C. 自我价值实现","D. 丰富有趣体验"] },
    { q: "等待排队的时候，你？", o:["A. 烦躁难以忍耐","B. 安静耐心等候","C. 利用等待时间思考","D. 找点事情打发时间"] },
    { q: "面对他人求助，你？", o:["A. 很难拒绝别人","B. 力所能及就帮忙","C. 判断成本再决定","D. 优先照顾自己"] },
    { q: "你对承诺的看法？", o:["A. 承诺必须坚守到底","B. 尽力兑现承诺","C. 情况变了可以调整","D. 很少轻易许诺"] },
    { q: "回想过去的遗憾，你？", o:["A. 反复自责放不下","B. 接纳遗憾向前走","C. 当作经验吸取教训","D. 基本不会回想"] },
    { q: "整体来看，你对生活的感受？", o:["A. 常常觉得疲惫沉重","B. 平淡有喜也有忧","C. 充满动力稳步前行","D. 轻松随性享受当下"] }
];

let current = 0;
let score = 0;
let realAgeVal = 0;
const answerScore = [0,2,4,6]; // A:0 B:2 C:4 D:6

// 页面切换
function hideAll(){
    document.getElementById('start-page').classList.add('hidden');
    document.getElementById('question-page').classList.add('hidden');
    document.getElementById('result-page').classList.add('hidden');
}

function startTest(){
    const inputAge = document.getElementById("realAge").value;
    if(!inputAge || inputAge <10 || inputAge>80){
        alert("请输入10~80之间有效的真实年龄");
        return;
    }
    realAgeVal = Number(inputAge);
    current = 0;
    score = 0;
    hideAll();
    document.getElementById('question-page').classList.remove('hidden');
    renderQuestion();
}

function renderQuestion(){
    const item = questions[current];
    document.getElementById("currentNum").innerText = current+1;
    document.getElementById("question-title").innerText = `${current+1}. ${item.q}`;
    document.getElementById("progressBar").style.width = ((current+1)/30*100)+"%";
    const box = document.getElementById("options-box");
    box.innerHTML = "";
    item.o.forEach((opt, idx)=>{
        box.innerHTML += `
        <div onclick="selectAnswer(${idx})" class="option-hover border border-slate-200 rounded-lg p-4 cursor-pointer">
            ${opt}
        </div>`
    })
}

function selectAnswer(idx){
    score += answerScore[idx];
    current++;
    if(current >= questions.length){
        showResult();
    }else{
        renderQuestion();
    }
}

function showResult(){
    hideAll();
    document.getElementById('result-page').classList.remove('hidden');
    // 分数换算心理年龄 总分0~180 → 15~70岁
    const psyAge = Math.round(15 + (score / 180)*55);
    const diff = psyAge - realAgeVal;
    document.getElementById("res-real").innerText = realAgeVal;
    document.getElementById("res-psy").innerText = psyAge;
    document.getElementById("diff-text").innerText = diff>0 ? `心理年龄比实际年龄大 ${diff} 岁` : diff<0 ? `心理年龄比实际年龄小 ${Math.abs(diff)} 岁` : `心理年龄和实际年龄一致`;
    let analysis = "";
    if(diff >= 10){
        analysis = `你的心智成熟度远超同龄人。你看待问题理性通透，习惯深度思考，抗压能力强，遇事冷静克制。更早懂得权衡取舍，很少情绪化冲动。但需要留意：成熟的外壳下，你容易习惯性压抑情绪，偶尔会觉得疲惫，不妨允许自己偶尔放松、示弱，不必时刻保持懂事坚强。`;
    }else if(diff >=3){
        analysis = `你的心理年龄略高于真实年龄。心智稳重，拥有不错的判断力，能妥善处理大部分生活难题。懂得体谅他人，做事有分寸。你拥有成年人的成熟，同时保留着内心柔软，是平衡感很好的状态。`;
    }else if(diff >= -3){
        analysis = `心理年龄和你的真实年龄基本匹配。心智发展自然均衡，拥有和年龄对应的思考能力，既有理性也保有情绪感知力。遇到事情可以正常应对，既能承担责任，也可以感受生活乐趣，属于非常健康的心理状态。`;
    }else if(diff >= -10){
        analysis = `你的心理年龄略小于真实年龄。内心保留着一份纯真，对世界抱有好奇心，容易感受到快乐。待人真诚，不喜欢复杂算计。需要注意：面对压力与挫折时，抗风险能力偏弱，遇到难题容易逃避或情绪化，可以慢慢练习独立处理问题。`;
    }else{
        analysis = `你的心理年龄明显小于实际年龄。内心天真浪漫，想象力丰富，很容易感知美好，对生活充满热忱。但心智比较单纯，容易情绪化，遇到挫折容易失落受伤，在做重大决定时容易冲动。建议多练习长远思考，建立边界感，学会保护自己。`;
    }
    document.getElementById("analysis-text").innerText = analysis;
}

function restart(){
    hideAll();
    document.getElementById('start-page').classList.remove('hidden');
}
</script>
</body>
</html>
